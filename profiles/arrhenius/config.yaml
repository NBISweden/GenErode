# Configuration file for slurm plugin (Snakemake >8.0.0) for Arrhenius cluster at NAISS
# snakemake CLI flags
executor: slurm
jobs: 100
printshellcmds: true
software-deployment-method: apptainer
use-apptainer: True
apptainer-prefix: "/nobackup/proj/disk/.../apptainer" # update this to a directory in which apptainer images are stored
apptainer-args: "-B /nobackup/proj/disk/..." # mount your project directory to the container, so that Snakemake can access input/output files

# slurm resources
## default-resources: applied to all jobs, overruled by resources defined below for jobs
# Arrhenius: do not set "nodes" (-N) unless you need a full node
default-resources:
  - slurm_account=naissXXXX-X-XX-cpu # update this to your slurm account, must end with -cpu
  - slurm_partition=cpu # use Arrhenius CPU partition
  - ntasks=1 # number of concurrent tasks / ranks
  - threads=2 # number of threads per task, corresponds to cpus-per-task or cores
  - "mem_mb=(threads*2700)" # memory in MB: 2700 MB per thread on Arrhenius
  - runtime=120 # default runtime in minutes (same as in the Rackham profile)
  - tmpdir=/scratch/local # do not use tmp/, var/tmp, or /dev/shm on Arrhenius due to limited size. Causes an error for localrules if run on the login node.

## set-threads: map rule names to cpus-per-task
set-threads:
