name: mitogenome_mapping

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE.md'
      - 'docs/**'
      - '.test/README.md'
      - 'workflow/docker/**'
      - 'utilities/**'
      - 'workflow/rules/0.1_reference_genome_preps.smk'
      - 'workflow/rules/0.2_repeat_identification.smk'
      - 'workflow/rules/2_mapping.smk'
      - 'workflow/rules/3.1.1_bam_rmdup_realign_indels.smk'
      - 'workflow/rules/3.1.2_user_provided_bam_stats.smk'
      - 'workflow/rules/3.2_historical_bam_mapDamage.smk'
      - 'workflow/rules/3.3_bam_subsampling.smk'
      - 'workflow/rules/4_genotyping.smk'
      - 'workflow/rules/5_CpG_identification.smk'
      - 'workflow/rules/6_autosome_sexchromosome_bed_files.smk'
      - 'workflow/rules/7_mlRho.smk'
      - 'workflow/rules/8.1_vcf_CpG_filtering.smk'
      - 'workflow/rules/8.2_vcf_qual_repeat_filtering.smk'
      - 'workflow/rules/9_merge_vcfs.smk'
      - 'workflow/rules/10_pca.smk'
      - 'workflow/rules/11_ROH.smk'
      - 'workflow/rules/12_snpEff.smk'
      - 'workflow/rules/13_GERP.smk'
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE.md'
      - 'docs/**'
      - '.test/README.md'
      - 'workflow/docker/**'
      - 'utilities/**'
      - 'workflow/rules/0.1_reference_genome_preps.smk'
      - 'workflow/rules/0.2_repeat_identification.smk'
      - 'workflow/rules/2_mapping.smk'
      - 'workflow/rules/3.1.1_bam_rmdup_realign_indels.smk'
      - 'workflow/rules/3.1.2_user_provided_bam_stats.smk'
      - 'workflow/rules/3.2_historical_bam_mapDamage.smk'
      - 'workflow/rules/3.3_bam_subsampling.smk'
      - 'workflow/rules/4_genotyping.smk'
      - 'workflow/rules/5_CpG_identification.smk'
      - 'workflow/rules/6_autosome_sexchromosome_bed_files.smk'
      - 'workflow/rules/7_mlRho.smk'
      - 'workflow/rules/8.1_vcf_CpG_filtering.smk'
      - 'workflow/rules/8.2_vcf_qual_repeat_filtering.smk'
      - 'workflow/rules/9_merge_vcfs.smk'
      - 'workflow/rules/10_pca.smk'
      - 'workflow/rules/11_ROH.smk'
      - 'workflow/rules/12_snpEff.smk'
      - 'workflow/rules/13_GERP.smk'
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Free Up GitHub Actions Ubuntu Runner Disk Space 🔧
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          # This might remove tools that are actually needed, if set to "true" but frees about 6 GB
          preinstalled-runtimes: false

          # All of these default to true, but feel free to set to "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v7
      
      - uses: eWaterCycle/setup-apptainer@v3
        with:
          apptainer-version: 1.5.5

      - uses: conda-incubator/setup-miniconda@v4
        with:
          channels: conda-forge,bioconda
          conda-remove-defaults: "true"
          activate-environment: generode
          environment-file: environment.yml

      - name: conda_environment
        shell: bash -l {0}
        run: |
          conda info
          conda list

      - name: mitogenome_mapping_dry
        shell: bash -l {0}
        run: |
          snakemake -np -k --configfile .test/config/config_mitogenomes.yaml --cores 1 --sdm apptainer

      - name: mitogenome_mapping
        shell: bash -l {0}
        run: |
          snakemake -k --configfile .test/config/config_mitogenomes.yaml --cores 1 --sdm apptainer

      - name: check_outputs
        shell: bash -l {0}
        run: |
          .test/scripts/check_outputs.sh mitogenomes

      - name: upload_checksums
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checksums-mitogenomes
          path: results/checksums/
          if-no-files-found: ignore
