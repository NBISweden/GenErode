name: gerp

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE.md'
      - 'docs/**'
      - '.test/README.md'
      - 'workflow/docker/**'
      - 'utilities/**'
      - 'workflow/rules/1.2_map_to_mitogenomes.smk'
      - 'workflow/rules/7_mlRho.smk'
      - 'workflow/rules/10_pca.smk'
      - 'workflow/rules/11_ROH.smk'
      - 'workflow/rules/12_snpEff.smk'
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE.md'
      - 'docs/**'
      - '.test/README.md'
      - 'workflow/docker/**'
      - 'utilities/**'
      - 'workflow/rules/1.2_map_to_mitogenomes.smk'
      - 'workflow/rules/7_mlRho.smk'
      - 'workflow/rules/10_pca.smk'
      - 'workflow/rules/11_ROH.smk'
      - 'workflow/rules/12_snpEff.smk'
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Free Up GitHub Actions Ubuntu Runner Disk Space 🔧
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          # This might remove tools that are actually needed, if set to "true" but frees about 6 GB
          preinstalled-runtimes: false

          # All of these default to true, but feel free to set to "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v7
      
      - uses: eWaterCycle/setup-apptainer@v3
        with:
          apptainer-version: 1.5.5

      - uses: conda-incubator/setup-miniconda@v4
        with:
          channels: conda-forge,bioconda
          conda-remove-defaults: "true"
          activate-environment: generode
          environment-file: environment.yml

      - name: conda_environment
        shell: bash -l {0}
        run: |
          conda info
          conda list

      - name: gerp_dry
        shell: bash -l {0}
        run: |
          snakemake -np -k --configfile .test/config/config_gerp.yaml --cores 1 --sdm apptainer

      - name: gerp
        shell: bash -l {0}
        run: |
          snakemake -k --configfile .test/config/config_gerp.yaml --cores 1 --sdm apptainer

      - name: check_outputs
        shell: bash -l {0}
        run: |
          .test/scripts/check_outputs.sh gerp

      - name: upload_checksums
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checksums-gerp
          path: results/checksums/
          if-no-files-found: ignore
